name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Run test suite — build fails if any test is red
      - name: Run tests
        run: node test/run.mjs

      # Build the Vite frontend for a quick smoke-check
      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

# Deployment is handled by Vercel's GitHub integration (auto-deploys on push
# to main), not by this workflow — no vercel CLI step or VERCEL_TOKEN needed here.
